<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 685" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="60%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#182337"/>
    </linearGradient>
    <radialGradient id="discordAura" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B7F34A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B7F34A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="685" fill="url(#commGrad)"/>
  <rect width="1600" height="685" fill="url(#discordAura)"/>

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <rect width="180" height="32" rx="16" fill="#182337" stroke="#B7F34A" stroke-width="1.5"/>
    <text x="90" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#B7F34A" text-anchor="middle" letter-spacing="3">GLOBAL CLUBHOUSE</text>

    <text x="0" y="110" font-family="'Oswald', sans-serif" font-weight="700" font-size="72" fill="#F5F3EB" letter-spacing="2">
      JOIN THE <tspan fill="#B7F34A">CRICKET27</tspan> SQUAD
    </text>

    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="20" fill="#8491A3" letter-spacing="1">
      5,000+ cricket fans, playtesters, and creators building the next era of sports gaming.
    </text>

    <g transform="translate(0, 220)">
      <rect width="240" height="54" rx="8" fill="#B7F34A"/>
      <text x="120" y="34" font-family="'Oswald', sans-serif" font-weight="700" font-size="18" fill="#101827" text-anchor="middle" letter-spacing="2">
        CONNECT DISCORD
      </text>
    </g>
  </g>

  <!-- Right Visual Crest Accent -->
  <g transform="translate(1180, 140)">
    <polygon points="160,20 290,95 290,250 160,325 30,250 30,95" fill="#182337" stroke="#B7F34A" stroke-width="4" stroke-dasharray="8,6"/>
    <text x="160" y="210" font-family="'Oswald', sans-serif" font-weight="700" font-size="130" fill="#B7F34A" text-anchor="middle">27</text>
  </g>
</svg>
