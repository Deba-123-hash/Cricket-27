  </text>

  <!-- Bottom Details Bar -->
  <line x1="240" y1="840" x2="840" y2="840" stroke="#263449" stroke-width="2"/>
  
  <text x="540" y="900" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#F5F3EB" text-anchor="middle" letter-spacing="4">
    OFFICIAL BRAND PROMOTIONAL ANNOUNCEMENT
  </text>
  <text x="540" y="935" font-family="'Inter', sans-serif" font-size="12" fill="#8491A3" text-anchor="middle">
