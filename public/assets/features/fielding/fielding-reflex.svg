<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#fieldBg)"/>
  <!-- Oval Boundary Rope -->
  <ellipse cx="300" cy="200" rx="240" ry="150" fill="#101827" stroke="#263449" stroke-width="2" stroke-dasharray="8,8"/>
  <!-- 30-Yard Infield Ring -->
  <ellipse cx="300" cy="200" rx="140" ry="90" fill="none" stroke="#263449" stroke-width="2"/>
  <!-- Center Pitch Strip -->
  <rect x="290" y="165" width="20" height="70" fill="#1E2A3E" stroke="#32445E"/>
  <!-- Fielder Positions with Lime Dots & Radar Beacons -->
  <!-- Wicketkeeper -->
  <circle cx="300" cy="255" r="7" fill="#B7F34A"/>
  <!-- Slips -->
  <circle cx="325" cy="265" r="6" fill="#F5F3EB"/>
  <circle cx="345" cy="275" r="6" fill="#F5F3EB"/>
  <!-- Point -->
  <circle cx="395" cy="210" r="6" fill="#B7F34A"/>
  <circle cx="395" cy="210" r="14" fill="none" stroke="#B7F34A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Cover -->
  <circle cx="370" cy="150" r="6" fill="#F5F3EB"/>
  <!-- Mid Off -->
  <circle cx="330" cy="130" r="6" fill="#F5F3EB"/>
  <!-- Mid On -->
  <circle cx="270" cy="130" r="6" fill="#F5F3EB"/>
  <!-- Mid Wicket -->
  <circle cx="230" cy="150" r="6" fill="#F5F3EB"/>
  <!-- Square Leg -->
  <circle cx="205" cy="210" r="6" fill="#F5F3EB"/>
  <!-- Deep Fine Leg -->
  <circle cx="160" cy="280" r="6" fill="#FF704D"/>
  <!-- Direct Hit Bullseye Graphic -->
  <g transform="translate(460, 80)">
    <circle r="30" fill="none" stroke="#B7F34A" stroke-width="2"/>
    <circle r="18" fill="none" stroke="#EF4444" stroke-width="2"/>
    <circle r="6" fill="#EF4444"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#B7F34A" stroke-width="1.5"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#B7F34A" stroke-width="1.5"/>
    <text x="0" y="48" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">DIRECT HIT WINDOW</text>
  </g>
  <!-- Technical Legend -->
  <text x="30" y="375" fill="#8491A3" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">FIELDING &bull; DYNAMIC RING PRESETS</text>
  <text x="570" y="375" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="end">TACTICAL RADAR</text>
</svg>