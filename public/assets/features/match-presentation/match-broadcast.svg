<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tvBg)"/>
  <!-- Broadcast Score Bar Ribbon -->
  <g transform="translate(40, 40)">
    <rect width="520" height="38" rx="6" fill="#101827" stroke="#263449" stroke-width="1.5"/>
    <rect width="100" height="38" rx="6" fill="#162238"/>
    <text x="18" y="24" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="16" font-weight="bold">IND 184/3</text>
    <text x="115" y="24" fill="#F5F3EB" font-family="'Inter', sans-serif" font-size="12" font-weight="600">OVERS 17.4</text>
    <text x="210" y="24" fill="#8491A3" font-family="'Inter', sans-serif" font-size="12">CRR: 10.41</text>
    <rect x="420" y="7" width="90" height="24" rx="4" fill="#FF704D"/>
    <text x="465" y="23" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LIVE BROADCAST</text>
  </g>
  <!-- DRS Stumps Perspective Graphic -->
  <g transform="translate(300, 200)">
    <!-- Pitch impact mark -->
    <ellipse cx="0" cy="80" rx="35" ry="12" fill="#B7F34A" opacity="0.3"/>
    <!-- Stumps -->
    <rect x="-24" y="-40" width="8" height="90" rx="2" fill="#F5F3EB"/>
    <rect x="-4" y="-40" width="8" height="90" rx="2" fill="#F5F3EB"/>
    <rect x="16" y="-40" width="8" height="90" rx="2" fill="#F5F3EB"/>
    <!-- Bails -->
    <rect x="-26" y="-44" width="22" height="4" fill="#FF704D"/>
    <rect x="4" y="-44" width="22" height="4" fill="#FF704D"/>
    <!-- Projected Ball Path (Hawkeye) -->
    <path d="M -120 120 Q -40 70 0 0" fill="none" stroke="#B7F34A" stroke-width="3.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="10" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Hawkeye DRS Telemetry Tag -->
  <g transform="translate(50, 160)">
    <rect width="150" height="85" rx="6" fill="#101827" stroke="#B7F34A" stroke-width="1.5"/>
    <text x="14" y="26" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="13" font-weight="bold">DRS HAWKEYE 2.0</text>
    <text x="14" y="46" fill="#F5F3EB" font-family="'Inter', sans-serif" font-size="11">Pitching: <tspan fill="#B7F34A" font-weight="bold">IN LINE</tspan></text>
    <text x="14" y="62" fill="#F5F3EB" font-family="'Inter', sans-serif" font-size="11">Impact: <tspan fill="#B7F34A" font-weight="bold">IN LINE</tspan></text>
    <text x="14" y="78" fill="#F5F3EB" font-family="'Inter', sans-serif" font-size="11">Wickets: <tspan fill="#EF4444" font-weight="bold">HITTING</tspan></text>
  </g>
  <!-- Technical Legend -->
  <text x="30" y="375" fill="#8491A3" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">PRESENTATION &bull; BROADCAST TELEMETRY &amp; HUD</text>
  <text x="570" y="375" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="end">ESPORTS HUD</text>
</svg>