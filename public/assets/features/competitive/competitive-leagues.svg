<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#compBg)"/>
  <!-- Championship Trophy Visual -->
  <g transform="translate(300, 160)">
    <!-- Base -->
    <rect x="-35" y="80" width="70" height="16" rx="3" fill="#263449"/>
    <rect x="-25" y="65" width="50" height="15" fill="#32445E"/>
    <!-- Stem -->
    <path d="M -12 65 L -16 20 L 16 20 L 12 65 Z" fill="#FF704D"/>
    <!-- Cup Body -->
    <path d="M -45 -40 Q -45 20 0 20 Q 45 20 45 -40 Z" fill="#B7F34A" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Handles -->
    <path d="M -45 -25 Q -65 -25 -55 0 Q -45 15 -35 10" fill="none" stroke="#B7F34A" stroke-width="4"/>
    <path d="M 45 -25 Q 65 -25 55 0 Q 45 15 35 10" fill="none" stroke="#B7F34A" stroke-width="4"/>
    <!-- Cricket Ball on Top -->
    <circle cx="0" cy="-60" r="14" fill="#FF704D" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-12" y1="-60" x2="12" y2="-60" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,2"/>
  </g>
  <!-- Tournament Bracket Wireframe Left -->
  <g stroke="#263449" stroke-width="2" fill="none" transform="translate(70, 90)">
    <rect x="0" y="0" width="90" height="26" rx="4" fill="#101827" stroke="#263449"/>
    <rect x="0" y="50" width="90" height="26" rx="4" fill="#101827" stroke="#263449"/>
    <path d="M 90 13 L 115 13 L 115 63 L 90 63"/>
    <line x1="115" y1="38" x2="140" y2="38" stroke="#B7F34A"/>
    <rect x="140" y="25" width="40" height="26" rx="4" fill="#162238" stroke="#B7F34A"/>
  </g>
  <!-- Rank Badge Right -->
  <g transform="translate(430, 90)">
    <rect width="130" height="80" rx="6" fill="#101827" stroke="#263449" stroke-width="1.5"/>
    <text x="65" y="26" fill="#8491A3" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LEADERBOARD TIER</text>
    <text x="65" y="52" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="22" font-weight="bold" text-anchor="middle">DIVISION I</text>
    <text x="65" y="68" fill="#F5F3EB" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">TOP 1% GLOBAL</text>
  </g>
  <!-- Technical Legend -->
  <text x="30" y="375" fill="#8491A3" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">COMPETITIVE &bull; GLOBAL LEAGUES &amp; CUPS</text>
  <text x="570" y="375" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="end">ESPORTS TIER</text>
</svg>