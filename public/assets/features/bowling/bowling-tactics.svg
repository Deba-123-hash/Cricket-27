<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bowlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bowlBg)"/>
  <!-- Pitch 2D Perspective Strip -->
  <polygon points="260,60 340,60 410,340 190,340" fill="#121A2A" stroke="#263449" stroke-width="2"/>
  <!-- Pitch Zones (Full, Good Length, Short, Yorker) -->
  <line x1="250" y1="120" x2="350" y2="120" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="360" y="124" fill="#EF4444" font-family="'Inter', sans-serif" font-size="10" font-weight="bold">YORKER</text>
  <line x1="235" y1="180" x2="365" y2="180" stroke="#B7F34A" stroke-width="2"/>
  <text x="375" y="184" fill="#B7F34A" font-family="'Inter', sans-serif" font-size="10" font-weight="bold">GOOD LENGTH</text>
  <line x1="215" y1="250" x2="385" y2="250" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="395" y="254" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="10" font-weight="bold">SHORT OF LENGTH</text>
  <!-- Ball Swing Trajectory Arc -->
  <path d="M 280 340 Q 250 200 305 130 T 325 70" fill="none" stroke="#B7F34A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Seam Revolution Indicator -->
  <g transform="translate(305, 130)">
    <circle r="14" fill="#FF704D" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,2"/>
    <circle r="22" fill="none" stroke="#B7F34A" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>
  <!-- Speed Telemetry Box -->
  <g transform="translate(40, 50)">
    <rect width="130" height="56" rx="4" fill="#101827" stroke="#263449" stroke-width="1.5"/>
    <text x="12" y="24" fill="#8491A3" font-family="'Inter', sans-serif" font-size="10" font-weight="600">DELIVERY SPEED</text>
    <text x="12" y="46" fill="#F5F3EB" font-family="'Oswald', sans-serif" font-size="20" font-weight="700">148.5 <tspan fill="#B7F34A" font-size="12">KM/H</tspan></text>
  </g>
  <!-- Seam Deviation Tag -->
  <g transform="translate(40, 120)">
    <rect width="130" height="42" rx="4" fill="#101827" stroke="#263449" stroke-width="1.5"/>
    <text x="12" y="22" fill="#8491A3" font-family="'Inter', sans-serif" font-size="10" font-weight="600">SEAM DEVIATION</text>
    <text x="12" y="36" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="14" font-weight="700">+2.4° OUTSWING</text>
  </g>
  <!-- Technical Legend -->
  <text x="30" y="375" fill="#8491A3" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">BOWLING &bull; SEAM, SWING &amp; VARIATION</text>
  <text x="570" y="375" fill="#B7F34A" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="end">SUB-MS DRIFT</text>
</svg>