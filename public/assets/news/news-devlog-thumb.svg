  </text>

  <!-- Graph Curve Overlay -->
  <path d="M 600 560 Q 840 380 1120 460" stroke="#FF704D" stroke-width="4" stroke-dasharray="6,4" fill="none"/>
  <circle cx="1120" cy="460" r="8" fill="#FF704D"/>

  <!-- Brand Signature -->
  <text x="80" y="640" font-family="'Oswald', sans-serif" font-weight="700" font-size="28" fill="#F5F3EB">
    CRICKET<tspan fill="#B7F34A">27</tspan>
  </text>
  <text x="220" y="638" font-family="'Inter', sans-serif" font-size="12" fill="#8491A3" letter-spacing="4">
