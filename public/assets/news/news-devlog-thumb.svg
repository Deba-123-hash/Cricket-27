      <stop offset="0%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#182337"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#newsBg)"/>

  <!-- Code & Graph Matrix Texture -->
  <g opacity="0.15" stroke="#B7F34A" stroke-width="1.5">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Tag Pill -->
  <rect x="80" y="80" width="220" height="36" rx="8" fill="#101827" stroke="#B7F34A" stroke-width="1.5"/>
  <text x="190" y="103" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#B7F34A" text-anchor="middle" letter-spacing="3">DEVLOG &bull; DISPATCH 01</text>

  <!-- Headline -->
  <text x="80" y="240" font-family="'Oswald', sans-serif" font-weight="700" font-size="64" fill="#F5F3EB" letter-spacing="2">
    THE ARCHITECTURE OF
  </text>
  <text x="80" y="320" font-family="'Oswald', sans-serif" font-weight="700" font-size="64" fill="#B7F34A" letter-spacing="2">
