<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="100%" height="100%">
  <defs>
    <linearGradient id="spiritBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080D16"/>
      <stop offset="50%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#141E30"/>
    </linearGradient>
    <linearGradient id="coralGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#FF704D"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8F76B"/>
      <stop offset="100%" stop-color="#B7F34A"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1440" fill="url(#spiritBg)"/>

  <!-- Radial Floodlight Beams -->
  <polygon points="540,0 200,1440 880,1440" fill="#B7F34A" fill-opacity="0.03"/>
  <polygon points="0,720 1080,400 1080,1040 0,720" fill="#FF704D" fill-opacity="0.02"/>

  <!-- Stylized Background Cricket Seam Arc -->
  <path d="M -100 720 Q 540 100 1180 720" stroke="#263449" stroke-width="4" stroke-dasharray="8,8" fill="none"/>
  <path d="M -100 780 Q 540 1200 1180 780" stroke="#263449" stroke-width="4" stroke-dasharray="8,8" fill="none"/>

  <!-- Huge Watermark Text: SPIRIT -->
  <text x="540" y="800" font-family="'Oswald', sans-serif" font-weight="700" font-size="340" fill="#182337" fill-opacity="0.35" text-anchor="middle" letter-spacing="12">
    SPIRIT
  </text>

  <!-- Top Tag -->
  <g transform="translate(100, 100)">
    <rect width="210" height="34" rx="17" fill="#182337" stroke="#FF704D" stroke-width="1.5"/>
    <text x="105" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FF704D" text-anchor="middle" letter-spacing="3">LIMITED POSTER 02</text>
  </g>

  <!-- Central Cricket Crest & Wicket Stumps Iconography -->
  <g transform="translate(540, 360)">
    <!-- Shield Outline -->
    <polygon points="0,-100 90,-45 90,55 0,110 -90,55 -90,-45" fill="#101827" stroke="url(#coralGlow)" stroke-width="5" stroke-linejoin="round"/>
    <!-- Three Stylized Stumps & Bails -->
    <rect x="-36" y="-45" width="12" height="90" rx="3" fill="#F5F3EB"/>
    <rect x="-6" y="-45" width="12" height="90" rx="3" fill="#B7F34A"/>
    <rect x="24" y="-45" width="12" height="90" rx="3" fill="#F5F3EB"/>
    <!-- Bails -->
    <rect x="-42" y="-55" width="40" height="6" rx="2" fill="#FF704D"/>
    <rect x="2" y="-55" width="40" height="6" rx="2" fill="#FF704D"/>
  </g>

  <!-- Main Headline -->
  <text x="540" y="930" font-family="'Oswald', sans-serif" font-weight="700" font-size="88" fill="#F5F3EB" text-anchor="middle" letter-spacing="8">
    THE SPIRIT OF
  </text>
  <text x="540" y="1030" font-family="'Oswald', sans-serif" font-weight="700" font-size="104" fill="#FF704D" text-anchor="middle" letter-spacing="10">
    CRICKET.
  </text>

  <!-- Subtitle -->
  <text x="540" y="1120" font-family="'Inter', sans-serif" font-weight="500" font-size="20" fill="#8491A3" text-anchor="middle" letter-spacing="4">
    HONOURING THE PASSION, RESPECT &amp; TRADITION
  </text>

  <!-- Footer Signature -->
  <line x1="160" y1="1260" x2="920" y2="1260" stroke="#263449" stroke-width="2"/>
  
  <text x="160" y="1310" font-family="'Oswald', sans-serif" font-weight="700" font-size="30" fill="#F5F3EB" letter-spacing="3">
    CRICKET<tspan fill="#B7F34A">27</tspan>
  </text>
  <text x="920" y="1310" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#8491A3" text-anchor="end" letter-spacing="4">
    AUTHENTIC SPORTS CULTURE &bull; POSTER SERIES
  </text>
</svg>
