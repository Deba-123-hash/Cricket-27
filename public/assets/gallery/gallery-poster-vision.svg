<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="100%" height="100%">
  <defs>
    <linearGradient id="visionBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A101C"/>
      <stop offset="50%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#152136"/>
    </linearGradient>
    <linearGradient id="limeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8F76B"/>
      <stop offset="100%" stop-color="#B7F34A"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1440" fill="url(#visionBg)"/>

  <!-- High-Tech Radar Angles & Grid Rays -->
  <line x1="540" y1="0" x2="540" y2="1440" stroke="#1F2C40" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="0" y1="720" x2="1080" y2="720" stroke="#1F2C40" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="540" cy="520" r="280" fill="none" stroke="#263449" stroke-width="2"/>
  <circle cx="540" cy="520" r="160" fill="none" stroke="#B7F34A" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8,8"/>

  <!-- Diagonal Flare Lines -->
  <line x1="0" y1="180" x2="1080" y2="860" stroke="#B7F34A" stroke-width="2" stroke-opacity="0.15"/>
  <line x1="1080" y1="180" x2="0" y2="860" stroke="#B7F34A" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Top Tag -->
  <g transform="translate(100, 100)">
    <rect width="210" height="34" rx="17" fill="#182337" stroke="#B7F34A" stroke-width="1.5"/>
    <text x="105" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#B7F34A" text-anchor="middle" letter-spacing="3">LIMITED POSTER 03</text>
  </g>

  <!-- Central Hexagonal Tech Crest with Stylized Bat & Ball Trajectory -->
  <g transform="translate(540, 520)">
    <!-- Hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="#101827" stroke="url(#limeGradient)" stroke-width="5" stroke-linejoin="round"/>
    <!-- Stylized Angular Bat Silhouette -->
    <path d="M -30 60 L 30 -60 L 45 -45 L -15 75 Z" fill="#F5F3EB"/>
    <!-- Ball Pulse Circle -->
    <circle cx="50" cy="-65" r="14" fill="#FF704D"/>
    <circle cx="50" cy="-65" r="24" fill="none" stroke="#FF704D" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <!-- Big Headline -->
  <text x="540" y="930" font-family="'Oswald', sans-serif" font-weight="700" font-size="88" fill="#F5F3EB" text-anchor="middle" letter-spacing="8">
    A NEW CRICKET
  </text>
  <text x="540" y="1030" font-family="'Oswald', sans-serif" font-weight="700" font-size="108" fill="#B7F34A" text-anchor="middle" letter-spacing="10">
    VISION.
  </text>

  <!-- Subtitle -->
  <text x="540" y="1120" font-family="'Inter', sans-serif" font-weight="500" font-size="20" fill="#8491A3" text-anchor="middle" letter-spacing="4">
    TACTICAL DEPTH &bull; MODERN 2D ARTISTRY
  </text>

  <!-- Footer Signature -->
  <line x1="160" y1="1260" x2="920" y2="1260" stroke="#263449" stroke-width="2"/>
  
  <text x="160" y="1310" font-family="'Oswald', sans-serif" font-weight="700" font-size="30" fill="#F5F3EB" letter-spacing="3">
    CRICKET<tspan fill="#B7F34A">27</tspan>
  </text>
  <text x="920" y="1310" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#8491A3" text-anchor="end" letter-spacing="4">
    CONCEPT DESIGN VAULT &bull; PRINT SERIES
  </text>
</svg>
