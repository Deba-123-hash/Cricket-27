<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="100%" height="100%">
  <defs>
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090E18"/>
      <stop offset="45%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#162034"/>
    </linearGradient>
    <linearGradient id="posterLimeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8F76B"/>
      <stop offset="100%" stop-color="#B7F34A"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1440" fill="url(#posterBg)"/>

  <!-- Stadium Light Cones (Diagonal Splash) -->
  <polygon points="0,0 600,0 1080,900 0,600" fill="#B7F34A" fill-opacity="0.04"/>
  <polygon points="1080,0 700,0 0,1100 1080,800" fill="#FF704D" fill-opacity="0.03"/>

  <!-- Massive Background Number 27 -->
  <text x="540" y="780" font-family="'Oswald', sans-serif" font-weight="700" font-size="540" fill="#182337" fill-opacity="0.4" text-anchor="middle">
    27
  </text>

  <!-- Top Header Tag -->
  <g transform="translate(100, 100)">
    <rect width="180" height="32" rx="16" fill="#182337" stroke="#B7F34A" stroke-width="1.5"/>
    <text x="90" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#B7F34A" text-anchor="middle" letter-spacing="3">OFFICIAL POSTER</text>
  </g>

  <!-- Central Brand Crest -->
  <g transform="translate(460, 260)">
    <polygon points="80,10 148,46 148,124 80,160 12,124 12,46" fill="#182337" stroke="url(#posterLimeGlow)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 46 48 Q 80 84 46 122" stroke="#263449" stroke-width="4" stroke-dasharray="4,4"/>
    <path d="M 114 48 Q 80 84 114 122" stroke="#263449" stroke-width="4" stroke-dasharray="4,4"/>
    <text x="80" y="104" font-family="'Oswald', sans-serif" font-weight="700" font-size="62" fill="#B7F34A" text-anchor="middle">27</text>
  </g>

  <!-- Big Typography: BEYOND THE BOUNDARY -->
  <text x="540" y="940" font-family="'Oswald', sans-serif" font-weight="700" font-size="92" fill="#F5F3EB" text-anchor="middle" letter-spacing="8">
    BEYOND THE
  </text>
  <text x="540" y="1030" font-family="'Oswald', sans-serif" font-weight="700" font-size="92" fill="#B7F34A" text-anchor="middle" letter-spacing="8">
    BOUNDARY
  </text>

  <!-- Subtitle Editorial Paragraph -->
  <text x="540" y="1120" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#8491A3" text-anchor="middle" letter-spacing="3">
    THE NEXT ERA OF 2D CRICKET GAMING
  </text>

  <!-- Brand Signature Footer -->
  <line x1="160" y1="1260" x2="920" y2="1260" stroke="#263449" stroke-width="2"/>
  
  <text x="160" y="1310" font-family="'Oswald', sans-serif" font-weight="700" font-size="30" fill="#F5F3EB" letter-spacing="3">
    CRICKET<tspan fill="#B7F34A">27</tspan>
  </text>
  <text x="920" y="1310" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#8491A3" text-anchor="end" letter-spacing="4">
    LIMITED EDITION PROMO POSTER &bull; SERIES 01
  </text>
</svg>
