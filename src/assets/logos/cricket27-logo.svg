<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cricketGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <linearGradient id="cricketGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <linearGradient id="cricketCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B81" />
      <stop offset="100%" stop-color="#FF2A4D" />
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(15, 10)">
    <polygon points="50,5 92,28 92,72 50,95 8,72 8,28" fill="#0F1626" stroke="url(#cricketGreen)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 28 25 Q 50 50 28 75" fill="none" stroke="#212E4A" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 72 25 Q 50 50 72 75" fill="none" stroke="#212E4A" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="50" y="58" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="34" fill="url(#cricketGreen)" text-anchor="middle">27</text>
  </g>

  <!-- Wordmark Text -->
  <text x="135" y="70" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="4">CRICKET</text>
  <text x="325" y="70" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="48" fill="url(#cricketGreen)" letter-spacing="2">27</text>
  
  <!-- Subtitle Tagline -->
  <text x="137" y="94" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="14" fill="#8A99AD" letter-spacing="6">THE NEXT ERA OF 2D CRICKET</text>
  <circle cx="342" cy="89" r="3" fill="url(#cricketGold)" />
</svg>
